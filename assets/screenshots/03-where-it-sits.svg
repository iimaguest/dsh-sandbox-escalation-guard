<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#0b0f14"/><text x="64" y="72" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" opacity="1">Where the guard sits</text><text x="64" y="104" fill="#8b98a5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">A Cordis plugin row with two hooks, no runtime dependency, and no residue when unmounted.</text><rect x="64" y="176" width="236" height="92" rx="10" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="64" y="176" width="236" height="3" rx="0" fill="#58a6ff" stroke="none" stroke-width="1" opacity="1"/><text x="182" y="216" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1">tools.schemas()</text><text x="182" y="240" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" text-anchor="middle" opacity="1">the full surface</text><line x1="300" y1="222" x2="332" y2="222" stroke="#5b6673" stroke-width="2"/><polygon points="332,217 342,222 332,227" fill="#5b6673"/><rect x="342" y="176" width="300" height="92" rx="10" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="342" y="176" width="300" height="3" rx="0" fill="#bc8cff" stroke="none" stroke-width="1" opacity="1"/><text x="492" y="216" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1">system-prompt/assemble</text><text x="492" y="240" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" text-anchor="middle" opacity="1">waterfall · per request</text><line x1="642" y1="222" x2="674" y2="222" stroke="#5b6673" stroke-width="2"/><polygon points="674,217 684,222 674,227" fill="#5b6673"/><rect x="684" y="176" width="252" height="92" rx="10" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="684" y="176" width="252" height="3" rx="0" fill="#3fb950" stroke="none" stroke-width="1" opacity="1"/><text x="810" y="216" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1">the model</text><text x="810" y="240" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" text-anchor="middle" opacity="1">narrowed surface</text><text x="492" y="308" fill="#bc8cff" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" text-anchor="middle" opacity="1">the guard rewrites here</text><text x="810" y="308" fill="#3fb950" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" text-anchor="middle" opacity="1">return value is authoritative</text><rect x="64" y="380" width="1072" height="264" rx="10" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="64" y="380" width="1072" height="40" rx="0" fill="#161d27" stroke="none" stroke-width="1" opacity="1"/><text x="82" y="406" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1">apply(ctx)  ·  lib/index.js</text><rect x="64" y="420" width="1072" height="1" rx="0" fill="#243040" stroke="none" stroke-width="1" opacity="1"/><rect x="64" y="380" width="1072" height="3" rx="0" fill="#243040" stroke="none" stroke-width="1" opacity="1"/><text x="90" y="454" fill="#bc8cff" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1">ctx.on('system-prompt/assemble',</text><text x="350.8" y="454" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1"> (assembly, context) =&gt; {</text><text x="90" y="476" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1">  const mode = resolveMode(context)   // scope is the caller</text><text x="90" y="498" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1">  return narrowTools(assembly.tools, mode)</text><text x="90" y="520" fill="#bc8cff" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1">})</text><text x="90" y="542" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1"></text><text x="90" y="564" fill="#bc8cff" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1">ctx.on('tools/pre-execute',</text><text x="310.05" y="564" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1"> (exec, next) =&gt; {</text><text x="90" y="586" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1">  // a cached schema can still send an unusable request</text><text x="90" y="608" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1">  return isUnusableEscalation(...) ? deny(escalationCorrection(...)) : next()</text><text x="90" y="630" fill="#bc8cff" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1">})</text><text x="64" y="678" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">28 tests, including what the model is actually handed and that unmounting restores the original surface exactly.</text></svg>