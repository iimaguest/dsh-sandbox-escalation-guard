<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0b0f14"/><text x="64" y="72" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" opacity="1">What the model is handed</text><text x="64" y="104" fill="#8b98a5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">bash tool schema, assembled per request · danger-full-access session</text><rect x="64" y="140" width="512" height="366" rx="10" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="64" y="140" width="512" height="40" rx="0" fill="#161d27" stroke="none" stroke-width="1" opacity="1"/><text x="82" y="166" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1">WITHOUT THE GUARD</text><rect x="64" y="180" width="512" height="1" rx="0" fill="#243040" stroke="none" stroke-width="1" opacity="1"/><rect x="64" y="140" width="512" height="3" rx="0" fill="#f85149" stroke="none" stroke-width="1" opacity="1"/><text x="86" y="218" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">properties:</text><text x="86" y="246" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">  command</text><text x="282" y="246" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">"type": "string"</text><text x="86" y="270" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">  sandbox_permissions</text><text x="282" y="270" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">"type": "string"</text><text x="86" y="294" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1"></text><text x="282" y="294" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">enum: [</text><text x="86" y="318" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1"></text><text x="282" y="318" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">  "workspace-write",</text><text x="86" y="342" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1"></text><text x="282" y="342" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">  "danger-full-access"</text><text x="86" y="366" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1"></text><text x="282" y="366" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">]</text><text x="86" y="390" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">  justification</text><text x="282" y="390" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">"type": "string"</text><rect x="86" y="430" width="468" height="1" rx="0" fill="#243040" stroke="none" stroke-width="1" opacity="1"/><text x="86" y="460" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">both values rejected at execution:</text><text x="86" y="482" fill="#f85149" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">not strictly wider than this</text><rect x="624" y="140" width="512" height="366" rx="10" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="624" y="140" width="512" height="40" rx="0" fill="#161d27" stroke="none" stroke-width="1" opacity="1"/><text x="642" y="166" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1">WITH THE GUARD</text><rect x="624" y="180" width="512" height="1" rx="0" fill="#243040" stroke="none" stroke-width="1" opacity="1"/><rect x="624" y="140" width="512" height="3" rx="0" fill="#3fb950" stroke="none" stroke-width="1" opacity="1"/><text x="646" y="218" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">properties:</text><text x="646" y="246" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">  command</text><text x="842" y="246" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">"type": "string"</text><rect x="646" y="430" width="468" height="1" rx="0" fill="#243040" stroke="none" stroke-width="1" opacity="1"/><text x="646" y="460" fill="#3fb950" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">both fields removed, and</text><text x="646" y="482" fill="#3fb950" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">the prose urging them too</text><rect x="64" y="552" width="1072" height="1" rx="0" fill="#243040" stroke="none" stroke-width="1" opacity="1"/><text x="64" y="588" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" opacity="1">Advertised from a load-time fact, validated against a per-session one.</text><text x="64" y="614" fill="#8b98a5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" opacity="1">They disagree at the ceiling, so the field is offered exactly where it can never be granted.</text><text x="64" y="662" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">zai/glm-5.3</text><text x="240" y="662" fill="#3fb950" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">211 calls, 0 escalation attempts</text><text x="64" y="688" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">gpt-6-astra</text><text x="240" y="688" fill="#f85149" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">8 of 8 bash calls attempted it, all 8 failed</text><text x="64" y="722" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">Same session, same schema, same repository.</text><text x="64" y="746" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">The only variable is whether a model completes the optional properties it was shown — GPT does, so only GPT fails.</text></svg>