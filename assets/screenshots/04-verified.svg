<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#0b0f14"/><text x="64" y="72" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" opacity="1">Verified against the harness</text><text x="64" y="104" fill="#8b98a5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">Output of node tools/… against a real Cordis context and a real systemPrompt registry.</text><rect x="64" y="156" width="1072" height="344" rx="10" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="64" y="156" width="1072" height="40" rx="0" fill="#161d27" stroke="none" stroke-width="1" opacity="1"/><text x="82" y="182" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1">Model-facing schema, per approval policy</text><rect x="64" y="196" width="1072" height="1" rx="0" fill="#243040" stroke="none" stroke-width="1" opacity="1"/><rect x="64" y="156" width="1072" height="3" rx="0" fill="#58a6ff" stroke="none" stroke-width="1" opacity="1"/><text x="90" y="230" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">policy never</text><text x="330" y="230" fill="#3fb950" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">properties = [command]</text><text x="330" y="252" fill="#3fb950" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">enum = ABSENT</text><text x="330" y="274" fill="#3fb950" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">escalation prose = STRIPPED</text><text x="330" y="296" fill="#3fb950" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">in EVERY mode</text><text x="90" y="316" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">policy ask</text><text x="330" y="316" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">properties = [command, sandbox_permissions, justification]</text><text x="330" y="338" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">enum = as the harness built it</text><text x="330" y="360" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" opacity="1">surface = byte-identical every turn</text><text x="64" y="552" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">The drift guard compares the mirrored ladder against @deepseek-ai/dsh-sandbox’s own export whenever the</text><text x="64" y="574" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">harness is resolvable, and skips rather than fails when it is not.</text></svg>