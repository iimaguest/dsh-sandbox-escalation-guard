<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#0b0f14"/><text x="64" y="72" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" opacity="1">Grantability, by session mode</text><text x="64" y="104" fill="#8b98a5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">The ladder is the one approveEscalation enforces; a drift-guard test fails if it ever changes.</text><text x="88" y="136" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" opacity="1">EFFECTIVE SESSION MODE</text><text x="384" y="136" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" opacity="1">ADVERTISED ENUM</text><text x="824" y="136" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" opacity="1">ESCALATION PROSE</text><rect x="64" y="150" width="1072" height="56" rx="8" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="64" y="150" width="3" height="56" rx="0" fill="#f85149" stroke="none" stroke-width="1" opacity="1"/><text x="88" y="184" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" text-anchor="start" opacity="1">danger-full-access</text><text x="384" y="184" fill="#f85149" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">fields removed</text><text x="824" y="184" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">prose removed</text><rect x="64" y="212" width="1072" height="56" rx="8" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="64" y="212" width="3" height="56" rx="0" fill="#d29922" stroke="none" stroke-width="1" opacity="1"/><text x="88" y="246" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" text-anchor="start" opacity="1">workspace-write</text><text x="384" y="246" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">["danger-full-access"]</text><text x="824" y="246" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">prose kept</text><rect x="64" y="274" width="1072" height="56" rx="8" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="64" y="274" width="3" height="56" rx="0" fill="#3fb950" stroke="none" stroke-width="1" opacity="1"/><text x="88" y="308" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" text-anchor="start" opacity="1">read-only</text><text x="384" y="308" fill="#3fb950" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">["workspace-write", "danger-full-access"]</text><text x="824" y="308" fill="#d29922" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">prose kept</text><rect x="64" y="336" width="1072" height="56" rx="8" fill="#121821" stroke="#1e2733" stroke-width="1" opacity="1"/><rect x="64" y="336" width="3" height="56" rx="0" fill="#f85149" stroke="none" stroke-width="1" opacity="1"/><text x="88" y="370" fill="#e6edf3" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" text-anchor="start" opacity="1">unrecognised mode</text><text x="384" y="370" fill="#f85149" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">fields removed</text><text x="824" y="370" fill="#8b98a5" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start" opacity="1">prose removed</text><rect x="64" y="458" width="1072" height="1" rx="0" fill="#243040" stroke="none" stroke-width="1" opacity="1"/><text x="64" y="496" fill="#e6edf3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" opacity="1">The guard never widens anything.</text><text x="64" y="524" fill="#8b98a5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" opacity="1">It removes capability from the advertised surface and adds none: a mode the harness would have</text><text x="64" y="548" fill="#8b98a5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" opacity="1">refused is no longer offered, and a mode it would have granted still is.</text><text x="64" y="596" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">An unrecognised mode fails closed — it grants nothing rather than everything, because offering an</text><text x="64" y="618" fill="#5b6673" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1">escalation would be the unsafe guess.</text></svg>